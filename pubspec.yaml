name: watcher
description: A clean offline-first movie and series tracker powered by OMDb and TMDB.
publish_to: "none"

version: 3.3.0+33

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5
  shared_preferences: ^2.5.5
  http: ^1.6.0
  dynamic_color: ^1.8.1
  path_provider: ^2.1.6
  share_plus: ^10.1.4
  file_selector: ^1.1.0
  package_info_plus: ^9.0.1
  cached_network_image: ^3.4.1 # ইমেজ ক্যাশিংয়ের জন্য এটি অ্যাড করা হয়েছে

  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
